<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f6a6c8">
	<title>Pink Day</title>
	<link rel="stylesheet" href="main.css">
	<script src="script.js" defer></script>
	
</head>
<body>
	<main>
		<button class="flower" type="button" aria-label="Change flower">🌸</button>
		<h1>Welcome!</h1>
		<p>Order your cake pops here!</p>
		<form id="order-form">
			<label for="name">Name</label>
			<input id="name" name="name" type="text" autocomplete="name" required>

			<label for="email">Email</label>
			<input id="email" name="email" type="email" autocomplete="email" required>

			<label for="flavor">Flavor</label>
			<input id="flavor" name="flavor" type="text" required>

			<label for="quantity">Quantity</label>
			<input id="quantity" name="quantity" type="number" min="1" value="1" required>

			<label for="pickupDate">Preferred pickup date</label>
			<input id="pickupDate" name="pickupDate" type="date">

			<label for="notes">Notes (optional)</label>
			<textarea id="notes" name="notes" rows="3"></textarea>

			<button class="submit-order" type="submit">Continue to email order</button>
		</form>
		<img class="product-image" src="cakepops.svg" alt="Illustration of pink and chocolate cake pops">
		<img class="decoration" src="https://media.giphy.com/media/3o6Zt481isNVuQI1l6/giphy.gif" alt="Pink Day GIF">
	</main>
</body>
</html>
